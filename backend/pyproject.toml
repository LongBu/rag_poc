[project]
name = "private-bedrock-chat"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=xml --cov-report=json"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
precision = 6
fail_under = 100
