name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: python -m pip install pipenv==2026.10.6
      - run: pipenv verify && pipenv sync --dev
        working-directory: backend
        env:
          PIPENV_VENV_IN_PROJECT: "1"
      - run: pipenv run pytest --cov=src --cov-branch --cov-fail-under=100
        working-directory: backend
      - name: Exact Python coverage counters
        run: pipenv run python -c 'import json; r=json.load(open("coverage.json")); assert r["totals"]["missing_lines"] == r["totals"]["missing_branches"] == 0'
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage -- --runInBand
        working-directory: frontend
      - name: Exact frontend coverage counters
        working-directory: frontend
        run: node -e 'const r=require("./coverage/coverage-final.json"); for(const f of Object.values(r)) for(const k of ["s","f","b"]) for(const n of Object.values(f[k]).flat()) if(n===0) throw new Error("Uncovered application code")'
      - run: npm run build
        working-directory: frontend
      - run: sh backend/scripts/build-lambda.sh
      - run: python backend/scripts/smoke-lambda.py
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: terraform -chdir=infra/bedrock init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/bedrock fmt -check -recursive
      - run: terraform -chdir=infra/bedrock validate
      - run: terraform -chdir=infra/bedrock test
